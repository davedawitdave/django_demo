<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>House Price Predictor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .result { margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #c3e6cb; color: #155724; border-radius: 4px; text-align: center; font-size: 1.2em; }
        .error { margin-top: 20px; padding: 15px; background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; border-radius: 4px; }
    </style>
</head>
<body>

<div class='container'>
    <h1>House Price AI</h1>

    <form action='{% url 'predict' %}' method='POST'>
        {% csrf_token %}
        
        <div class='form-group'>
            <label>Area (sq ft)</label>
            <input type='number' name='area' required placeholder='e.g. 5000'>
        </div>
        
        <div class='form-group'>
            <label>Bedrooms</label>
            <input type='number' name='bedrooms' required placeholder='e.g. 3'>
        </div>

        <div class='form-group'>
            <label>Bathrooms</label>
            <input type='number' name='bathrooms' required placeholder='e.g. 2'>
        </div>

        <div class='form-group'>
            <label>Stories</label>
            <input type='number' name='stories' required placeholder='e.g. 2'>
        </div>

        <div class='form-group'>
            <label>Parking Spots</label>
            <input type='number' name='parking' required placeholder='e.g. 1'>
        </div>

        <div class='form-group'>
            <label>Main Road?</label>
            <select name='mainroad'>
                <option value='1'>Yes</option>
                <option value='0'>No</option>
            </select>
        </div>

        <div class='form-group'>
            <label>Guest Room?</label>
            <select name='guestroom'>
                <option value='1'>Yes</option>
                <option value='0'>No</option>
            </select>
        </div>

        <div class='form-group'>
            <label>Basement?</label>
            <select name='basement'>
                <option value='1'>Yes</option>
                <option value='0'>No</option>
            </select>
        </div>

        <div class='form-group'>
            <label>Hot Water Heating?</label>
            <select name='hotwaterheating'>
                <option value='1'>Yes</option>
                <option value='0'>No</option>
            </select>
        </div>

        <div class='form-group'>
            <label>Air Conditioning?</label>
            <select name='airconditioning'>
                <option value='1'>Yes</option>
                <option value='0'>No</option>
            </select>
        </div>

        <div class='form-group'>
            <label>Preferred Area?</label>
            <select name='prefarea'>
                <option value='1'>Yes</option>
                <option value='0'>No</option>
            </select>
        </div>

        <div class='form-group'>
            <label>Furnishing Status</label>
            <select name='furnishingstatus'>
                <option value='0'>Unfurnished</option>
                <option value='1'>Semi-Furnished</option>
                <option value='2'>Furnished</option>
            </select>
        </div>

        <button type='submit'>Predict Price</button>
    </form>

    {% if prediction %}
        <div class='result'>
            <strong>Estimated Price:</strong> {{ prediction }}
        </div>
    {% endif %}

    {% if error %}
        <div class='error'>
            <strong>Error:</strong> {{ error }}
        </div>
    {% endif %}
</div>

</body>
</html>
